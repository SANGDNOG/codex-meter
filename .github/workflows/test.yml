name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  v1-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:v1
  v1-v2-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check installer shell syntax
        run: sh -n v2/install/install.sh
